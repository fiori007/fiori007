<style>
  .w{animation-name:flick;animation-iteration-count:infinite;animation-timing-function:steps(1)}
  @keyframes flick{0%{opacity:.9}35%{opacity:.15}55%{opacity:.85}80%{opacity:.3}}
  .r{animation-name:rain;animation-iteration-count:infinite;animation-timing-function:linear}
  @keyframes rain{from{transform:translate(0,-40px)}to{transform:translate(-30px,200px)}}
  .fog{animation:drift 26s linear infinite alternate}
  @keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(80px)}}
  .fade1{opacity:0;animation:fadein 2.2s ease-out .4s forwards}
  .fade2{opacity:0;animation:fadein 2s ease-out 1.6s forwards}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .bolt{opacity:0;animation:bolt 12s infinite}
  @keyframes bolt{0%,92%,100%{opacity:0}93%{opacity:.5}94%{opacity:.05}95.5%{opacity:.35}97%{opacity:0}}
</style>
