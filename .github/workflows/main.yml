name: Generate Datas

on:
  schedule: # every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/main.yml", "profile/**"]

permissions:
  contents: write

jobs:
  snake:
    name: Snake animation
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: fiori007
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#c9a961&color_dots=#161b22,#1d3a2c,#2c6647,#3e8f62,#56b583

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary-cards:
    name: Profile summary cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: -3

      - name: Build muted night palette
        run: |
          git pull --ff-only
          rm -rf profile-summary-card-output/mono profile-summary-card-output/night
          cp -r profile-summary-card-output/github_dark profile-summary-card-output/night
          cd profile-summary-card-output/night
          sed -i -E             -e 's/#40c463/#4F9D73/gI' -e 's/#0366d6/#C9A961/gI' -e 's/#77909c/#8B98A6/gI'             -e 's/#e34c26/#C9694A/gI' -e 's/#b07219/#C9A24D/gI' -e 's/#3572a5/#5F8FC4/gI'             -e 's/#3178c6/#4AA3A0/gI' -e 's/#f34b7d/#B8688F/gI' -e 's/#da5b0b/#B9783F/gI' *.svg
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-summary-card-output/night profile-summary-card-output/mono
          git diff --cached --quiet || (git commit -m "chore: refresh night stats cards" && git push)

  profile-card:
    name: Neofetch profile card
    needs: summary-cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python profile/build.py
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          USER_NAME: fiori007
      - name: Commit
        run: |
          git pull --ff-only || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --cached --quiet || (git commit -m "chore: refresh profile card" && git push)
